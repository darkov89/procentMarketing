[project]
name = "leadmachine"
version = "0.1.0"
description = "Lead Machine - System automatyzacji B2B dla Procent Marketing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.30",
    "openpyxl>=3.1.2",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
    "google-genai>=0.1.1",
    "holidays>=0.50",
    "httpx>=0.27.0",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]

[project.scripts]
leadmachine = "leadmachine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
